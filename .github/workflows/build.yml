name: Build index.html

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "template/**"
      - "build.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html
        run: python3 build.py

      - name: Commit rebuilt index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unverändert, nichts zu committen."
          else
            git add index.html
            git commit -m "Automatischer Build: index.html aus content/ aktualisiert"
            git push
          fi
