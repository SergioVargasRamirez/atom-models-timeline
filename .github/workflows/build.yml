name: Build timeline.html

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "template/**"
      - "build.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build timeline.html und Menü
        run: python3 build.py

      - name: Commit rebuilt timeline.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Seiten unverändert, nichts zu committen."
          else
            git add -A -- '*.html'
            git commit -m "Automatischer Build: timeline.html und Seitenmenü aktualisiert"
            git push
          fi
